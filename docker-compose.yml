services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    environment:
      DOCKER_HOST: http://docker-proxy:2375
    depends_on: [docker-proxy]
    restart: unless-stopped
    networks: [app, control]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 100
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      EXEC: 1
      POST: 1
      DELETE: 1
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks: [control]
    tmpfs: [/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  attacker-image:
    image: cyberbox-attacker:latest
    build: ./containers/attacker
    profiles: [images]
    command: ["true"]
  target-image:
    image: bkimminich/juice-shop:latest
    profiles: [images]
    command: ["true"]
networks:
  app: {}
  control:
    internal: true
