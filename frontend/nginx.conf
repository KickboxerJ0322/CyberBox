map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_pass http://backend:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /ws/ { proxy_pass http://backend:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
  location /lab/ { proxy_pass http://backend:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 60s; }
  location / { try_files $uri $uri/ /index.html; }
}
